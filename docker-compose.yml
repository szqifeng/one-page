services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rolling_plan}
      POSTGRES_USER: ${POSTGRES_USER:-planner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-planner} -d ${POSTGRES_DB:-rolling_plan}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgres://${POSTGRES_USER:-planner}:${POSTGRES_PASSWORD:-change-me-in-production}@db:5432/${POSTGRES_DB:-rolling_plan}
      DEFAULT_TEAM_NAME: ${DEFAULT_TEAM_NAME:-规划团队}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-ChangeMe123!}
      AUTH_MODE: ${AUTH_MODE:-local}
      OAUTH2_ENABLED: ${OAUTH2_ENABLED:-false}
      OAUTH2_AUTHORIZATION_URL: ${OAUTH2_AUTHORIZATION_URL:-}
      OAUTH2_TOKEN_URL: ${OAUTH2_TOKEN_URL:-}
      OAUTH2_PROFILE_URL: ${OAUTH2_PROFILE_URL:-}
      OAUTH2_CLIENT_ID: ${OAUTH2_CLIENT_ID:-}
      OAUTH2_CLIENT_SECRET: ${OAUTH2_CLIENT_SECRET:-}
      OAUTH2_REDIRECT_URI: ${OAUTH2_REDIRECT_URI:-http://localhost/api/auth/oauth2/callback}
      OAUTH2_SCOPES: ${OAUTH2_SCOPES:-openid profile email}
      OAUTH2_EMAIL_FIELD: ${OAUTH2_EMAIL_FIELD:-email}
      OAUTH2_TEAM_ID: ${OAUTH2_TEAM_ID:-team-default}
      OAUTH2_AUTO_PROVISION: ${OAUTH2_AUTO_PROVISION:-true}
      OAUTH2_DEFAULT_ROLE_ID: ${OAUTH2_DEFAULT_ROLE_ID:-role-no-access}
      BACKUP_TIMES: ${BACKUP_TIMES:-02:00,10:00,18:00}
      BACKUP_TIMEZONE: ${BACKUP_TIMEZONE:-Asia/Shanghai}
    ports:
      - "${API_PORT:-3001}:3001"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - api

volumes:
  postgres_data:
